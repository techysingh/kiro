global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend http-in
    bind *:80
    bind *:443 ssl crt /etc/ssl/private/irvh.bawas.com.pem
    redirect scheme https code 301 if !{ ssl_fc }
    
    # Define ACLs for your domains
    acl is_irvh hdr(host) -i .irvh.bawas.com
    
    # Use the appropriate backend based on the domain
    use_backend irvh_backend if is_irvh

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 10s
    stats auth admin:your_secure_password

backend irvh_backend
    balance roundrobin
    server app1 your_backend_server:port check 

