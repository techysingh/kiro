services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "5053:53/tcp"
      - "5053:53/udp"
      - "6067:67/udp"
      - "8081:80/tcp"
    environment:
      TZ: 'US/Los_Angeles'
      WEBPASSWORD: Liv%@since1930
      ServerIP: '192.168.0.178'
    volumes:
      - ./data/pihole:/etc/pihole
      - ./config/pihole:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  haproxy:
    container_name: haproxy
    image: haproxy:latest
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./config/haproxy:/usr/local/etc/haproxy
      - ./data/haproxy/ssl:/etc/ssl/private
      - ./data/haproxy/www:/var/www/html
    depends_on:
      - certbot
    restart: unless-stopped

  certbot:
    container_name: certbot
    image: certbot/certbot
    volumes:
      - ./data/haproxy/ssl:/etc/letsencrypt
      - ./config/haproxy:/etc/nginx/conf.d
      - ./data/haproxy/www:/var/www/html
    command: certonly --webroot --webroot-path=/var/www/html --email certs@bawas.com -d *.irvh.bawas.com --agree-tos --non-interactive --expand
    restart: unless-stopped

  openvpn:
    container_name: openvpn
    image: openvpn/openvpn-as:latest
    platform: linux/arm64
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    ports:
      - "1194:1194/udp"
      - "1943:943/tcp"
      - "1944:944/tcp"
    volumes:
      - ./config/openvpn:/config
      - ./data/openvpn:/data
    environment:
      - TZ=US/Los_Angeles
      - OVPN_SERVER=192.168.0.178
      - OVPN_PROTOCOL=udp
      - OVPN_NETWORK=10.8.0.0/24
      - OVPN_NETNAME=OpenVPN
      - OVPN_DNS=1.1.1.1
      - OVPN_MTU=1400
      - WEBUI_PORT=1943
      - WEBUI_PASSWORD=Sh@r1TaxCollector
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped 