# HAProxy Log Rotation Configuration
# Rotates HAProxy logs with compression and retention policies

/var/log/haproxy/*.log {
    # Rotate daily
    daily
    
    # Keep 30 days of logs (configurable retention period)
    rotate 30
    
    # Compress rotated logs to save disk space
    compress
    
    # Delay compression until next rotation cycle
    delaycompress
    
    # Don't rotate if log file is empty
    notifempty
    
    # Create new log files with specific permissions
    create 644 haproxy haproxy
    
    # Use date as suffix for rotated files
    dateext
    
    # Don't fail if log file is missing
    missingok
    
    # Copy and truncate original file instead of moving
    copytruncate
    
    # Post-rotation script to ensure HAProxy continues logging
    postrotate
        # Send USR1 signal to HAProxy to reopen log files
        /bin/kill -USR1 $(cat /var/run/haproxy.pid 2>/dev/null) 2>/dev/null || true
    endscript
}

# Separate configuration for access logs
/var/log/haproxy/access.log {
    daily
    rotate 30
    compress
    delaycompress
    notifempty
    create 644 haproxy haproxy
    dateext
    missingok
    copytruncate
    
    postrotate
        /bin/kill -USR1 $(cat /var/run/haproxy.pid 2>/dev/null) 2>/dev/null || true
    endscript
}

# Separate configuration for error logs
/var/log/haproxy/error.log {
    daily
    rotate 30
    compress
    delaycompress
    notifempty
    create 644 haproxy haproxy
    dateext
    missingok
    copytruncate
    
    postrotate
        /bin/kill -USR1 $(cat /var/run/haproxy.pid 2>/dev/null) 2>/dev/null || true
    endscript
}