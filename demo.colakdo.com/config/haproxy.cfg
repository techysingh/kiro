#---------------------------------------------------------------------
# HAProxy Configuration for *.colakdo.com with SSL Termination
#---------------------------------------------------------------------

#---------------------------------------------------------------------
# Global settings
#---------------------------------------------------------------------
global
    # Process management
    daemon
    user haproxy
    group haproxy
    
    # SSL/TLS settings - Enhanced security hardening
    # Strong cipher suites prioritizing AEAD ciphers and forward secrecy
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    
    # Additional SSL security options
    ssl-default-server-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-server-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    ssl-default-server-options ssl-min-ver TLSv1.2 no-tls-tickets
    
    # Logging - External log files via syslog service
    log 127.0.0.1:514 local0 info
    log-tag haproxy
    
    # Stats socket for runtime management (disabled for container)
    # stats socket /var/run/haproxy.sock mode 600 level admin
    # stats timeout 2m
    
    # Performance tuning and security hardening
    tune.ssl.default-dh-param 2048
    tune.ssl.capture-buffer-size 1
    tune.ssl.cachesize 100000
    tune.ssl.lifetime 300
    tune.ssl.maxrecord 1460
    
    # Security hardening
    tune.http.maxhdr 100
    tune.bufsize 32768

#---------------------------------------------------------------------
# Default settings
#---------------------------------------------------------------------
defaults
    mode http
    log global
    option httplog
    option dontlognull
    option log-health-checks
    option forwardfor except 127.0.0.0/8
    option redispatch
    option log-separate-errors
    
    # Timeouts
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    timeout http-request 10s
    timeout http-keep-alive 2s
    timeout check 10s
    
    # Error handling
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

#---------------------------------------------------------------------
# Frontend - HTTP (Port 80) - Reject with 403 Forbidden
#---------------------------------------------------------------------
frontend http_frontend
    bind *:80
    mode http
    
    # Enhanced security headers for HTTP rejection
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-Frame-Options "DENY"
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    http-response set-header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"
    http-response set-header Permissions-Policy "geolocation=(), microphone=(), camera=()"
    http-response set-header X-Permitted-Cross-Domain-Policies "none"
    http-response set-header Cross-Origin-Embedder-Policy "require-corp"
    http-response set-header Cross-Origin-Opener-Policy "same-origin"
    http-response set-header Cross-Origin-Resource-Policy "same-origin"
    
    # Log HTTP attempts for security monitoring
    capture request header Host len 64
    capture request header User-Agent len 128
    
    # Return 403 Forbidden for all HTTP requests
    http-request deny deny_status 403

#---------------------------------------------------------------------
# Frontend - HTTPS (Port 443) - SSL Termination and Routing
#---------------------------------------------------------------------
frontend https_frontend
    bind *:443 ssl crt /etc/ssl/certs/live/colakdo.com/combined.pem alpn h2,http/1.1
    mode http
    
    # Enhanced security headers for HTTPS
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-Frame-Options "SAMEORIGIN"
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    http-response set-header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'"
    http-response set-header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), speaker=()"
    http-response set-header X-Permitted-Cross-Domain-Policies "none"
    http-response set-header Cross-Origin-Embedder-Policy "unsafe-none"
    http-response set-header Cross-Origin-Opener-Policy "same-origin-allow-popups"
    http-response set-header Cross-Origin-Resource-Policy "cross-origin"
    
    # Capture headers for logging
    capture request header Host len 64
    capture request header User-Agent len 128
    capture request header X-Forwarded-For len 64
    
    # SNI-based routing using ACLs
    acl is_root_domain hdr(host) -i colakdo.com
    acl is_www_domain hdr(host) -i www.colakdo.com
    acl is_api_domain hdr(host) -i api.colakdo.com
    acl is_app_domain hdr(host) -i app.colakdo.com
    acl is_admin_domain hdr(host) -i admin.colakdo.com
    acl is_demo_domain hdr(host) -i demo.colakdo.com
    
    # Route to appropriate backends based on subdomain
    use_backend root_backend if is_root_domain
    use_backend www_backend if is_www_domain
    use_backend api_backend if is_api_domain
    use_backend app_backend if is_app_domain
    use_backend admin_backend if is_admin_domain
    use_backend demo_backend if is_demo_domain
    
    # Default backend for unmatched subdomains
    default_backend default_backend

#---------------------------------------------------------------------
# Stats Frontend - HAProxy Statistics with Enhanced Monitoring
#---------------------------------------------------------------------
frontend stats_frontend
    bind *:8404
    mode http
    
    # Basic authentication for stats (configure credentials via environment)
    # stats auth admin:${STATS_PASSWORD:-secure_password_change_me}
    
    # Enhanced stats configuration
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
    stats show-legends
    stats show-node
    stats show-desc "HAProxy Load Balancer for *.colakdo.com"
    
    # Additional monitoring endpoints
    stats uri /haproxy/stats
    stats realm "HAProxy Statistics"
    stats hide-version
    
    # Health check endpoint
    monitor-uri /health
    
    # Security headers for stats interface
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-Frame-Options "DENY"
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    http-response set-header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'"
    
    # Rate limiting for stats access
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny if { sc_http_req_rate(0) gt 20 }

#---------------------------------------------------------------------
# Backend Definitions
#---------------------------------------------------------------------

# Root domain backend (colakdo.com)
backend root_backend
    mode http
    balance roundrobin
    option redispatch
    retries 3
    
    # Enhanced health checks with multiple validation points
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host colakdo.com hdr User-Agent HAProxy-Health-Check
    http-check expect status 200
    http-check expect string "healthy"
    
    # Graceful handling of unavailable backends
    option allbackups
    option prefer-last-server
    
    # Health check intervals and timeouts
    default-server check inter 10s fastinter 2s downinter 5s rise 2 fall 3
    default-server maxconn 100 maxqueue 50
    
    # Backend service discovery within proxy-network
    # Servers will be automatically discovered when containers join proxy-network
    # Example server configurations (uncomment and modify as needed):
    # server root1 root-service:80 check weight 100
    # server root2 root-service-2:80 check weight 100 backup
    
    # Fallback server for maintenance mode
    server maintenance 127.0.0.1:8080 check backup disabled
    
    # Default response when no servers are available
    errorfile 503 /usr/local/etc/haproxy/errors/503.http

# WWW subdomain backend (www.colakdo.com)
backend www_backend
    mode http
    balance leastconn
    option redispatch
    retries 3
    
    # Enhanced health checks
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host www.colakdo.com hdr User-Agent HAProxy-Health-Check
    http-check expect status 200
    http-check expect string "healthy"
    
    # Graceful handling of unavailable backends
    option allbackups
    option prefer-last-server
    
    # Health check configuration
    default-server check inter 10s fastinter 2s downinter 5s rise 2 fall 3
    default-server maxconn 100 maxqueue 50
    
    # Backend service discovery
    # server www1 www-service:80 check weight 100
    # server www2 www-service-2:80 check weight 100
    
    # Fallback server
    server maintenance 127.0.0.1:8080 check backup disabled
    
    errorfile 503 /usr/local/etc/haproxy/errors/503.http

# API subdomain backend (api.colakdo.com) - High availability with sticky sessions
backend api_backend
    mode http
    balance source
    option redispatch
    retries 3
    
    # API-specific health checks
    option httpchk
    http-check send meth GET uri /api/health ver HTTP/1.1 hdr Host api.colakdo.com hdr User-Agent HAProxy-Health-Check
    http-check expect status 200
    http-check expect rstring "\"status\":\s*\"ok\""
    
    # Session persistence for API consistency
    hash-type consistent
    
    # Graceful handling
    option allbackups
    option prefer-last-server
    
    # Stricter health checks for API services
    default-server check inter 5s fastinter 1s downinter 3s rise 3 fall 2
    default-server maxconn 200 maxqueue 100
    
    # Backend service discovery
    # server api1 api-service:8080 check weight 100
    # server api2 api-service-2:8080 check weight 100
    # server api3 api-service-3:8080 check weight 50 backup
    
    # Maintenance server
    server maintenance 127.0.0.1:8080 check backup disabled
    
    errorfile 503 /usr/local/etc/haproxy/errors/503.http

# App subdomain backend (app.colakdo.com) - Optimized for web applications
backend app_backend
    mode http
    balance uri whole
    option redispatch
    retries 3
    
    # Application health checks
    option httpchk
    http-check send meth GET uri /app/health ver HTTP/1.1 hdr Host app.colakdo.com hdr User-Agent HAProxy-Health-Check
    http-check expect status 200
    http-check expect string "application_ready"
    
    # URI-based load balancing for better caching
    hash-type consistent
    
    # Graceful handling
    option allbackups
    option prefer-last-server
    
    # Application-optimized timeouts
    default-server check inter 15s fastinter 3s downinter 10s rise 2 fall 3
    default-server maxconn 150 maxqueue 75
    
    # Backend service discovery
    # server app1 app-service:3000 check weight 100
    # server app2 app-service-2:3000 check weight 100
    
    # Maintenance server
    server maintenance 127.0.0.1:8080 check backup disabled
    
    errorfile 503 /usr/local/etc/haproxy/errors/503.http

# Admin subdomain backend (admin.colakdo.com) - High security, limited connections
backend admin_backend
    mode http
    balance first
    option redispatch
    retries 2
    
    # Admin-specific health checks with authentication simulation
    option httpchk
    http-check send meth GET uri /admin/health ver HTTP/1.1 hdr Host admin.colakdo.com hdr User-Agent HAProxy-Health-Check hdr X-Health-Check true
    http-check expect status 200
    http-check expect string "admin_healthy"
    
    # Prefer first available server for admin consistency
    option prefer-last-server
    
    # Conservative health check settings for admin services
    default-server check inter 20s fastinter 5s downinter 15s rise 3 fall 2
    default-server maxconn 50 maxqueue 25
    
    # Backend service discovery
    # server admin1 admin-service:8443 check weight 100 ssl verify none
    # server admin2 admin-service-2:8443 check weight 50 backup ssl verify none
    
    # Maintenance server
    server maintenance 127.0.0.1:8080 check backup disabled
    
    errorfile 503 /usr/local/etc/haproxy/errors/503.http

# Demo subdomain backend (demo.colakdo.com) - Flexible for demonstrations
backend demo_backend
    mode http
    balance roundrobin
    option redispatch
    retries 3
    
    # Demo health checks
    option httpchk
    http-check send meth GET uri /demo/health ver HTTP/1.1 hdr Host demo.colakdo.com hdr User-Agent HAProxy-Health-Check
    http-check expect status 200
    
    # Flexible handling for demo environments
    option allbackups
    
    # Standard health check configuration
    default-server check inter 10s fastinter 2s downinter 5s rise 2 fall 3
    default-server maxconn 100 maxqueue 50
    
    # Backend service discovery
    # server demo1 demo-service:80 check weight 100
    # server demo2 demo-service-2:80 check weight 100
    
    # Maintenance server
    server maintenance 127.0.0.1:8080 check backup disabled
    
    errorfile 503 /usr/local/etc/haproxy/errors/503.http

# Default backend for unmatched subdomains
backend default_backend
    mode http
    
    # Simple health check for default backend
    option httpchk GET /health
    http-check expect status 200
    
    # Minimal configuration for catch-all
    default-server check inter 30s rise 1 fall 2
    
    # Default maintenance response
    server maintenance 127.0.0.1:8080 check disabled
    
    # Return 404 for unmatched subdomains
    errorfile 503 /usr/local/etc/haproxy/errors/404.http
