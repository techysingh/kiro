global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend http-in
    bind *:80
    mode http
    redirect scheme https code 301 if !{ ssl_fc }

frontend https-in
    bind *:443 ssl crt /etc/haproxy/certs/
    mode http
    
    # ACL for different subdomains
    acl host_pihole hdr(host) -i pihole.irvh.bawas.com
    acl host_vpn hdr(host) -i vpn.irvh.bawas.com

    # Route to backends based on hostname
    use_backend pihole if host_pihole
    use_backend openvpn if host_vpn

backend pihole
    mode http
    server pihole pihole:80 check

backend openvpn
    mode http
    server openvpn openvpn:943 check 